name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Vet and test
        run: go vet ./... && go test ./...

      - name: Set version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wails.json'));c.info={...c.info,productVersion:'$v'};fs.writeFileSync('wails.json',JSON.stringify(c,null,2));"

      - name: Wails build
        run: wails build -clean -nsis -installscope user -platform windows/amd64 -ldflags "-X main.version=${GITHUB_REF_NAME#v}"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/bin/workbuddy-checkin.exe \
            build/bin/workbuddy-checkin-amd64-installer.exe \
            --generate-notes
